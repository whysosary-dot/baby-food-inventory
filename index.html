<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이유식 재고">
<meta name="theme-color" content="#f5b301">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>이유식 식재료 재고</title>
<style>
:root{
  --bg:#faf8f4; --card:#fff; --line:#e9e4da; --text:#2c2a26; --sub:#8b857a;
  --accent:#f5b301; --accent-dark:#a87b00; --minus:#e8785a; --plus:#4caf7d;
  --danger:#d9534f; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17161a; --card:#232228; --line:#35333b; --text:#f1efe9; --sub:#a09a90; --accent-dark:#f0c454; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--text); font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 92px) env(safe-area-inset-left);
}
.wrap{max-width:720px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer
}
.status{font-size:11.5px;color:var(--sub);margin:0 0 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:0 0 8px}
.dot.dirty{background:var(--minus)} .dot.clean{background:var(--plus)}

.search{position:relative;margin-bottom:8px}
.search input{
  width:100%;padding:12px 38px 12px 36px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:16px;outline:none;-webkit-appearance:none
}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--sub);font-size:17px;padding:8px;cursor:pointer}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lbl{font-size:11.5px;color:var(--sub);font-weight:700;padding:0 2px}
.chip{
  padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#3a2c00}
.spacer{flex:1;min-width:4px}

.list{display:flex;flex-direction:column;gap:8px}
.row{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 10px 10px 12px;display:flex;align-items:center;gap:8px
}
.left{flex:1;min-width:0}
.nm input{
  font:inherit;font-size:16.5px;font-weight:700;letter-spacing:-.3px;background:transparent;border:0;
  color:var(--text);width:100%;outline:none;padding:0;text-overflow:ellipsis
}
.sub{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11.5px;color:var(--sub)}
.dwrap{position:relative;display:inline-flex;align-items:center;font-weight:600}
.dwrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.dplus{font-size:11px}
.dplus.warn{color:var(--minus);font-weight:800}
.del{border:0;background:transparent;color:var(--sub);font-size:12px;padding:2px 4px;cursor:pointer;opacity:.75}

.ctrl{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.rnd{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:0;color:#fff;font-size:21px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;padding:0
}
.rnd.minus{background:var(--minus)} .rnd.plus{background:var(--plus)}
.rnd:disabled{opacity:.28}
.qty{
  width:54px;text-align:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;
  background:transparent;border:0;color:var(--text);outline:none;padding:4px 0;-moz-appearance:textfield
}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty.zero{color:var(--minus)}
.empty{text-align:center;color:var(--sub);padding:38px 10px;font-size:14px}

.fabbar{
  position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom))
}
.fabbar .inner{max-width:720px;width:100%;margin:0 auto;display:flex;gap:7px}
.btn{
  flex:1;padding:13px 6px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#3a2c00}
.btn.primary.dirty{box-shadow:0 0 0 3px rgba(245,179,1,.3)}
.btn:disabled{opacity:.5}

dialog{
  border:0;border-radius:18px;padding:0;background:var(--card);color:var(--text);width:min(430px,92vw);
  box-shadow:0 16px 50px rgba(0,0,0,.25)
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px}
.dlg h2{margin:0 0 14px;font-size:17.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:5px}
.field input,.field select{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:16px;outline:none
}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.dlgbtns{display:flex;gap:8px;margin-top:14px}
.hint{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:5px}
.hint a{color:var(--accent-dark)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:#2c2a26;color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:99;max-width:88vw;text-align:center
}
.toast.show{opacity:.96}
.toast.err{background:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍼 이유식 식재료</h1>
    <button class="icon-btn" id="btnSettings" title="설정">⚙️</button>
  </header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">불러오는 중…</span></div>

  <div class="search">
    <span class="mag">🔍</span>
    <input id="q" type="search" placeholder="재료 검색 (예: 소고기)" autocomplete="off">
    <button class="clr" id="qclr" style="display:none">✕</button>
  </div>
  <div class="chips">
    <span class="lbl">정렬</span>
    <button class="chip" data-sort="date">날짜</button>
    <button class="chip" data-sort="name">재료</button>
    <button class="chip on" data-sort="qty">재고</button>
    <button class="chip" id="dirBtn">↓</button>
    <span class="spacer"></span>
    <span class="lbl">± 단위</span>
    <button class="chip on" data-step="5">5g</button>
    <button class="chip" data-step="10">10g</button>
    <button class="chip" data-step="30">30g</button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">표시할 재료가 없어요.</div>
</div>

<div class="fabbar"><div class="inner">
  <button class="btn" id="btnAdd">＋ 재료 추가</button>
  <button class="btn primary" id="btnPush">↑ 커밋 &amp; 푸시</button>
</div></div>

<div class="toast" id="toast"></div>

<dialog id="dlgAdd"><form method="dialog" class="dlg" id="formAdd">
  <h2>재료 추가</h2>
  <div class="field"><label>재료명</label><input id="fName" required placeholder="예: 소고기"></div>
  <div class="frow">
    <div class="field"><label>구매일</label><input id="fDate" type="date" required></div>
    <div class="field"><label>수량 (g)</label><input id="fQty" type="number" inputmode="numeric" step="5" min="0" value="90" required></div>
  </div>
  <div class="dlgbtns">
    <button class="btn" type="button" id="addCancel">취소</button>
    <button class="btn primary" type="submit">추가</button>
  </div>
</form></dialog>

<dialog id="dlgSet"><form method="dialog" class="dlg" id="formSet">
  <h2>⚙️ 동기화 설정</h2>
  <div class="field"><label>GitHub 저장소</label><input id="sRepo" placeholder="owner/repo"></div>
  <div class="field">
    <label>GitHub 토큰</label>
    <input id="sToken" type="password" placeholder="ghp_… 또는 github_pat_…" autocomplete="off">
    <div class="hint">
      이 기기의 브라우저에만 저장되고 저장소에는 올라가지 않습니다.
      아이폰·아이패드에서도 한 번만 붙여넣으면 계속 동기화됩니다.<br>
      토큰 발급 → <a href="https://github.com/settings/tokens/new?scopes=repo&description=baby-food-inventory" target="_blank" rel="noopener">github.com/settings/tokens</a>
      (권한 <b>repo</b>, 또는 이 저장소의 <b>Contents: Read and write</b>)
    </div>
  </div>
  <div class="field">
    <label>자동 저장</label>
    <select id="sAuto">
      <option value="off">끔 — 커밋 &amp; 푸시 버튼으로 저장</option>
      <option value="on">켬 — 변경 8초 뒤 자동 푸시</option>
    </select>
  </div>
  <div class="field" style="margin-bottom:0">
    <label>복구</label>
    <button class="btn" type="button" id="btnPull" style="width:100%;flex:none">↓ GitHub에서 최신 상태로 되돌리기</button>
    <div class="hint">평소엔 앱을 열 때 자동으로 최신 데이터를 불러옵니다. 이 버튼은 이 기기의 변경사항을 버리고 강제로 다시 받아올 때만 쓰세요.</div>
  </div>
  <div class="dlgbtns">
    <button class="btn" type="button" id="setClose">닫기</button>
    <button class="btn primary" type="submit">저장</button>
  </div>
</form></dialog>

<script>
"use strict";
var LS = { data:'bfi.data', token:'bfi.token', repo:'bfi.repo', auto:'bfi.auto',
           sort:'bfi.sort', step:'bfi.step', sha:'bfi.sha', dirty:'bfi.dirty' };
var DEFAULT_REPO = (location.hostname.indexOf('github.io') > -1 && location.pathname.split('/')[1])
  ? location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1]
  : 'whysosary-dot/baby-food-inventory';

var state = { items: [], updatedAt: null };
var sha = localStorage.getItem(LS.sha) || null;
var dirty = localStorage.getItem(LS.dirty) === '1';
var sort = { key:'qty', dir:1 };
try { sort = JSON.parse(localStorage.getItem(LS.sort)) || sort; } catch(e){}
var step = parseInt(localStorage.getItem(LS.step) || '5', 10);
var query = '', autoTimer = null, toastTimer = null;

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function getToken(){ return localStorage.getItem(LS.token) || ''; }
function getRepo(){ return localStorage.getItem(LS.repo) || DEFAULT_REPO; }

function todayStr(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
function daysSince(ds){
  if(!ds) return null;
  var a = Date.parse(ds + 'T00:00:00+09:00'), b = Date.parse(todayStr() + 'T00:00:00+09:00');
  if (isNaN(a)) return null;
  return Math.round((b-a)/86400000);
}
function uid(){ return 'i' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function b64encode(str){
  var by = new TextEncoder().encode(str), bin = '';
  for (var i=0;i<by.length;i++) bin += String.fromCharCode(by[i]);
  return btoa(bin);
}
function b64decode(b64){
  var bin = atob(String(b64).replace(/\s/g,'')), by = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) by[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(by);
}
function toast(msg, isErr){
  var t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast'; }, isErr ? 5000 : 2200);
}
function fmtTime(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return String(iso).slice(0,16); }
}

function saveLocal(){
  dirty = true; localStorage.setItem(LS.dirty,'1');
  localStorage.setItem(LS.data, JSON.stringify(state));
  renderStatus(); scheduleAuto();
}
function renderStatus(){
  var total = state.items.reduce(function(s,i){ return s + (i.qty||0); }, 0);
  var summary = state.items.length + '종 · 합계 ' + total + 'g';
  $('#dot').className = 'dot ' + (dirty ? 'dirty' : 'clean');
  $('#statusText').textContent = dirty
    ? summary + ' · 저장 안 된 변경사항 있음'
    : summary + ' · 동기화됨 ' + (fmtTime(state.updatedAt) || '');
  $('#btnPush').classList.toggle('dirty', dirty);
}
function scheduleAuto(){
  if (localStorage.getItem(LS.auto) !== 'on') return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(function(){ push(true); }, 8000);
}

function visibleItems(){
  var q = query.trim().toLowerCase();
  var arr = state.items.filter(function(it){ return !q || (it.name||'').toLowerCase().indexOf(q) >= 0; });
  var k = sort.key, d = sort.dir;
  arr.sort(function(a,b){
    var r;
    if (k === 'name') r = (a.name||'').localeCompare(b.name||'', 'ko');
    else if (k === 'qty') r = (a.qty||0) - (b.qty||0);
    else r = String(a.date||'').localeCompare(String(b.date||''));
    if (r === 0) r = (a.name||'').localeCompare(b.name||'', 'ko');
    return r * d;
  });
  return arr;
}

function render(){
  var arr = visibleItems(), list = $('#list');
  list.innerHTML = '';
  $('#empty').style.display = arr.length ? 'none' : 'block';

  arr.forEach(function(it){
    var ds = daysSince(it.date);
    var row = document.createElement('div'); row.className = 'row';

    var left = document.createElement('div'); left.className = 'left';

    var nm = document.createElement('div'); nm.className = 'nm';
    var nIn = document.createElement('input');
    nIn.value = it.name || ''; nIn.setAttribute('aria-label','재료명');
    nIn.onchange = function(){ it.name = nIn.value.trim(); saveLocal(); render(); };
    nm.appendChild(nIn);

    var sub = document.createElement('div'); sub.className = 'sub';
    var dw = document.createElement('span'); dw.className = 'dwrap';
    var dtxt = document.createElement('span');
    dtxt.textContent = it.date ? it.date.slice(2).replace(/-/g,'.') : '날짜 없음';
    var dIn = document.createElement('input');
    dIn.type = 'date'; dIn.value = it.date || ''; dIn.setAttribute('aria-label','구매일');
    dIn.onchange = function(){ it.date = dIn.value; saveLocal(); render(); };
    dw.appendChild(dtxt); dw.appendChild(dIn);

    var dp = document.createElement('span');
    dp.className = 'dplus' + (ds !== null && ds >= 5 ? ' warn' : '');
    dp.textContent = ds === null ? '' : (ds === 0 ? '오늘' : 'D+' + ds);

    var del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.textContent = '🗑 삭제';
    del.onclick = function(){
      if (confirm('"' + (it.name||'') + '" 을(를) 삭제할까요?')){
        state.items = state.items.filter(function(x){ return x.id !== it.id; });
        saveLocal(); render();
      }
    };
    sub.appendChild(dw); sub.appendChild(dp); sub.appendChild(del);

    left.appendChild(nm); left.appendChild(sub);

    var ctrl = document.createElement('div'); ctrl.className = 'ctrl';
    var minus = document.createElement('button');
    minus.className = 'rnd minus'; minus.type = 'button'; minus.textContent = '−';
    minus.disabled = (it.qty||0) <= 0;
    minus.onclick = function(){ it.qty = Math.max(0, (it.qty||0) - step); saveLocal(); render(); };

    var qIn = document.createElement('input');
    qIn.className = 'qty' + ((it.qty||0) === 0 ? ' zero' : '');
    qIn.type = 'number'; qIn.inputMode = 'numeric'; qIn.value = it.qty || 0;
    qIn.setAttribute('aria-label','재고(g)');
    qIn.onchange = function(){ it.qty = Math.max(0, parseInt(qIn.value||'0',10) || 0); saveLocal(); render(); };

    var plus = document.createElement('button');
    plus.className = 'rnd plus'; plus.type = 'button'; plus.textContent = '+';
    plus.onclick = function(){ it.qty = (it.qty||0) + step; saveLocal(); render(); };

    ctrl.appendChild(minus); ctrl.appendChild(qIn); ctrl.appendChild(plus);

    row.appendChild(left); row.appendChild(ctrl);
    list.appendChild(row);
  });
  renderStatus();
}

function apiUrl(){ return 'https://api.github.com/repos/' + getRepo() + '/contents/data.json'; }
function normalize(obj){
  var items = (obj && obj.items) || [];
  return {
    updatedAt: (obj && obj.updatedAt) || null,
    items: items.map(function(it){
      return { id: it.id || uid(), name: it.name || '', qty: Number(it.qty)||0, date: it.date || '' };
    })
  };
}

async function pull(silent){
  var tk = getToken();
  try{
    var text;
    if (tk){
      var res = await fetch(apiUrl() + '?ref=main&t=' + Date.now(), {
        headers:{ 'Authorization':'Bearer ' + tk, 'Accept':'application/vnd.github+json' }
      });
      if (res.status === 401) throw new Error('토큰이 올바르지 않아요. 설정에서 다시 입력해 주세요.');
      if (res.status === 404) throw new Error('저장소/파일을 찾을 수 없어요 (' + getRepo() + ')');
      if (!res.ok) throw new Error('불러오기 실패 (' + res.status + ')');
      var j = await res.json();
      sha = j.sha; localStorage.setItem(LS.sha, sha);
      text = b64decode(j.content);
    } else {
      var r2 = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
      if (!r2.ok) throw new Error('data.json을 불러오지 못했어요');
      text = await r2.text();
    }
    state = normalize(JSON.parse(text));
    dirty = false; localStorage.setItem(LS.dirty,'0');
    localStorage.setItem(LS.data, JSON.stringify(state));
    render();
    if (!silent) toast('GitHub에서 불러왔어요');
  }catch(e){
    if (!silent) toast(e.message, true);
    renderStatus();
  }
}

async function push(isAuto){
  var tk = getToken();
  if (!tk){ openSettings(); toast('먼저 GitHub 토큰을 입력해 주세요', true); return; }
  var btn = $('#btnPush'), label = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 푸시 중';
  try{
    var head = await fetch(apiUrl() + '?ref=main&t=' + Date.now(), {
      headers:{ 'Authorization':'Bearer ' + tk, 'Accept':'application/vnd.github+json' }
    });
    if (head.ok){ sha = (await head.json()).sha; }
    else if (head.status === 404){ sha = null; }
    else if (head.status === 401){ throw new Error('토큰이 올바르지 않아요.'); }

    state.updatedAt = new Date().toISOString();
    var payload = { updatedAt: state.updatedAt, step: step, items: state.items };
    var body = {
      message: '재고 업데이트 ' + fmtTime(state.updatedAt),
      content: b64encode(JSON.stringify(payload, null, 2) + '\n'),
      branch: 'main'
    };
    if (sha) body.sha = sha;

    var res = await fetch(apiUrl(), {
      method:'PUT',
      headers:{ 'Authorization':'Bearer ' + tk, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok){
      var err = await res.json().catch(function(){ return {}; });
      throw new Error('푸시 실패 (' + res.status + ') ' + (err.message || ''));
    }
    var out = await res.json();
    sha = out.content.sha; localStorage.setItem(LS.sha, sha);
    dirty = false; localStorage.setItem(LS.dirty,'0');
    localStorage.setItem(LS.data, JSON.stringify(state));
    renderStatus();
    toast(isAuto ? '자동 저장됨 ✓' : '커밋 & 푸시 완료 ✓');
  }catch(e){
    toast(e.message, true);
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

$('#q').addEventListener('input', function(e){
  query = e.target.value;
  $('#qclr').style.display = query ? 'block' : 'none';
  render();
});
$('#qclr').addEventListener('click', function(){
  query=''; $('#q').value=''; $('#qclr').style.display='none'; render();
});
$$('.chip[data-sort]').forEach(function(b){
  b.addEventListener('click', function(){
    if (sort.key === b.dataset.sort) sort.dir *= -1; else sort.key = b.dataset.sort;
    localStorage.setItem(LS.sort, JSON.stringify(sort)); syncChips(); render();
  });
});
$('#dirBtn').addEventListener('click', function(){
  sort.dir *= -1; localStorage.setItem(LS.sort, JSON.stringify(sort)); syncChips(); render();
});
$$('.chip[data-step]').forEach(function(b){
  b.addEventListener('click', function(){
    step = parseInt(b.dataset.step,10); localStorage.setItem(LS.step, String(step)); syncChips();
  });
});
function syncChips(){
  $$('.chip[data-sort]').forEach(function(b){ b.classList.toggle('on', b.dataset.sort === sort.key); });
  $$('.chip[data-step]').forEach(function(b){ b.classList.toggle('on', parseInt(b.dataset.step,10) === step); });
  $('#dirBtn').textContent = sort.dir === 1 ? '↑' : '↓';
}

$('#btnAdd').addEventListener('click', function(){
  $('#fName').value=''; $('#fDate').value=todayStr(); $('#fQty').value=90;
  $('#dlgAdd').showModal();
  setTimeout(function(){ $('#fName').focus(); }, 60);
});
$('#addCancel').addEventListener('click', function(){ $('#dlgAdd').close(); });
$('#formAdd').addEventListener('submit', function(){
  var name = $('#fName').value.trim();
  if (!name) return;
  state.items.push({ id: uid(), name: name,
    qty: Math.max(0, parseInt($('#fQty').value||'0',10)||0),
    date: $('#fDate').value || todayStr() });
  saveLocal(); render(); toast('추가했어요 — 커밋 & 푸시로 저장하세요');
});

function openSettings(){
  $('#sRepo').value = getRepo();
  $('#sToken').value = getToken();
  $('#sAuto').value = localStorage.getItem(LS.auto) || 'off';
  $('#dlgSet').showModal();
}
$('#btnSettings').addEventListener('click', openSettings);
$('#setClose').addEventListener('click', function(){ $('#dlgSet').close(); });
$('#formSet').addEventListener('submit', function(){
  localStorage.setItem(LS.repo, $('#sRepo').value.trim() || DEFAULT_REPO);
  localStorage.setItem(LS.token, $('#sToken').value.trim());
  localStorage.setItem(LS.auto, $('#sAuto').value);
  toast('설정을 저장했어요');
  if (!dirty) pull(true);
});
$('#btnPull').addEventListener('click', function(){
  if (dirty && !confirm('이 기기에서 저장하지 않은 변경사항이 사라집니다. 계속할까요?')) return;
  $('#dlgSet').close();
  pull(false);
});
$('#btnPush').addEventListener('click', function(){ push(false); });
window.addEventListener('beforeunload', function(e){ if (dirty){ e.preventDefault(); e.returnValue=''; } });

(function init(){
  syncChips();
  var cached = localStorage.getItem(LS.data);
  if (cached){ try{ state = normalize(JSON.parse(cached)); }catch(e){} }
  render();
  if (dirty){ renderStatus(); toast('저장 안 된 변경사항이 남아 있어요'); }
  else { pull(true); }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !dirty) pull(true);
  });
  window.addEventListener('focus', function(){ if (!dirty) pull(true); });
  window.addEventListener('online', function(){ if (!dirty) pull(true); });
})();
</script>
</body>
</html>
